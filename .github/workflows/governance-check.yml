name: Governance Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  project-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Validate project registry and isolation
        run: node scripts/validate-project-registry.mjs
