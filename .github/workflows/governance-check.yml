name: Governance Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  project-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate project registry and isolation
        run: node scripts/validate-project-registry.mjs
