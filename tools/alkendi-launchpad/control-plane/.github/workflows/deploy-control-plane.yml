name: Owner-approved control-plane release
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RELEASE-CONTROL to authorize publishing this control plane
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: launchpad-control-production
  cancel-in-progress: false
jobs:
  production:
    if: github.event.inputs.confirmation == 'RELEASE-CONTROL'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run check
      - name: Deploy after Cloudflare Access, isolated D1 and secret setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 migrations apply alkendi-launchpad-control --remote
          npx wrangler deploy
